# Windows Docker Desktop bridge-mode override. Use together with docker-compose.yml.
# Configure BCA_DISCOVERY_SUBNETS in .env.bca with the intended private printer
# CIDRs; bridge networking cannot rely on SSDP multicast.
services:
  bambuddy:
    # Compose reset removes Linux host networking and restores the default bridge network.
    network_mode: !reset null
    ports:
      - "${BCA_DOCKER_PORT:-8012}:8000"
    environment:
      # Required for virtual-printer FTP passive mode on Docker Desktop.
      - VIRTUAL_PRINTER_PASV_ADDRESS=host.docker.internal
