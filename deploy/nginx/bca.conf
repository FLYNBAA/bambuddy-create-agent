# Same-origin Bambuddy/BCA HTTPS reverse-proxy template.
# Replace bca.example.com and the certificate paths before enabling the site.
# Bambuddy remains authoritative for browser sessions, API keys, and WebSocket
# authorization; do not add proxy-level authentication bypasses.

map $http_upgrade $bambuddy_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream bambuddy_bca {
    # Linux host-network Compose default. Bridge deployments should use the
    # deliberately published loopback port instead.
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bca.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bca.example.com;

    ssl_certificate     /etc/letsencrypt/live/bca.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bca.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 550m;

    location = /api/v1/ws {
        proxy_pass http://bambuddy_bca;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bambuddy_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # The upstream serves the SPA and every API route on one HTTPS origin.
    # Provider capability routes carry an independent unguessable token and are
    # still confined by the application; never expose DATA_DIR directly.
    location / {
        proxy_pass http://bambuddy_bca;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Creator modules synchronously wait for providers: Hunyuan and Meshy
        # permit 900 s service-side processing. Nginx's 60 s defaults would
        # close an otherwise healthy external API request before headers exist.
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
        send_timeout 1000s;
        # Preserve the upstream FileResponse stream and large multipart upload
        # flow instead of buffering full artifacts in the proxy worker.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
